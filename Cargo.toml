[package]
name = "doris-ingress"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow = { version = "59.3", features = ["ipc"] }
arrow-flight = { version = "59.3", features = ["flight-sql"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["form", "http1", "http2", "json", "matched-path", "original-uri", "query", "tokio", "tower-log", "tracing"], default-features = false }
base64 = "0.23.1"
bytes = { version = "1.12.1", features = ["serde"] }
crc32c = "0.6.9"
datafusion = "55.2.0"
futures-util = "0.3.34"
getrandom = "0.3"
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls", "default-rustls-ring"] }
object_store = { version = "0.14.2", features = ["aws"] }
openraft = { version = "0.10.0", features = ["serde"] }
parking_lot = "0.13.0"
parquet = { version = "59.3", features = ["arrow"] }
prost = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "http2"] }
rmp-serde = "1.3.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
toml = "1.2.1"
tonic = "0.14"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
